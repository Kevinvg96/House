<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ons nieuwe huis — 360° rondleiding</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="panorama"></div>

<div id="missing-photo">
  <div class="icon">＋</div>
  <p>Voor deze kamer staat nog geen foto klaar.<br>
  Zet een equirectangulaire foto als <code>pano.jpg</code> in de bijhorende map onder <code>/rooms</code>.</p>
</div>

<div id="topbar">
  <div>
    <h1 id="room-name">Kamer</h1>
    <span id="room-count"></span>
  </div>
  <div class="nav-arrows">
    <button id="prev-btn" class="arrow-btn" aria-label="Vorige kamer">‹</button>
    <button id="next-btn" class="arrow-btn" aria-label="Volgende kamer">›</button>
  </div>
</div>

<div id="angle-strip-wrap">
  <div id="angle-strip"></div>
</div>

<div id="door-strip"></div>

<div id="welcome">
  <span class="eyebrow">Een rondleiding</span>
  <h1>Welkom in ons nieuwe huis</h1>
  <p>Sleep of veeg om rond te kijken in elke kamer, en loop via de deuren onderaan naar de volgende ruimte.</p>
  <button id="enter-btn">Naar binnen</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="js/rooms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
